<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blackjack</title>
    <meta name="description" content="Play Blackjack in your browser, powered by the Deck of Cards API." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>" />
    <link rel="preconnect" href="https://deckofcardsapi.com" />
    <link rel="preconnect" href="https://xvyfefwjkabjzdqartrt.supabase.co" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body class="auth-loading">
    <!-- Sign-in screen (shown when nobody is signed in) -->
    <section id="login-screen" class="login-screen" hidden>
      <div class="login-card">
        <div class="login-suits" aria-hidden="true"><span>♠</span><span class="red">♥</span><span>♣</span><span class="red">♦</span></div>
        <h1>Blackjack</h1>
        <p class="login-tagline">Take a seat at the table. Sign in to play and keep your bankroll.</p>
        <button id="btn-google" class="btn-google">
          <svg viewBox="0 0 48 48" aria-hidden="true" width="20" height="20">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
          </svg>
          <span>Continue with Google</span>
        </button>
        <p id="login-error" class="login-error" role="alert" hidden></p>
      </div>
    </section>

    <div id="loading-screen" class="loading-screen" aria-live="polite">Loading…</div>
    <script>
      // If the sign-in library can't load (offline, blocked), say so instead of spinning forever.
      setTimeout(function () {
        if (document.body.classList.contains("auth-loading")) {
          document.getElementById("loading-screen").textContent =
            "Couldn't load sign-in. Check your connection and refresh the page.";
        }
      }, 12000);
    </script>

    <div id="game" class="game" hidden>
    <header class="topbar">
      <h1>Blackjack</h1>
      <div class="user" id="user-chip">
        <span class="avatar"><img id="user-avatar" alt="" referrerpolicy="no-referrer" hidden /><span id="user-initials"></span></span>
        <span class="user-text">
          <span id="user-greeting" class="greeting"></span>
          <button id="btn-signout" class="link-btn">Sign out</button>
        </span>
      </div>
      <div class="stats">
        <div class="stat"><span class="label">Bankroll</span><span id="bankroll" class="value">$0</span></div>
        <div class="stat"><span class="label">Shoe</span><span id="shoe" class="value">—</span></div>
      </div>
    </header>

    <main class="table">
      <section class="area dealer-area" aria-label="Dealer">
        <div class="area-head">
          <h2>Dealer</h2>
          <span id="dealer-score" class="score" hidden></span>
        </div>
        <div id="dealer-cards" class="cards"></div>
      </section>

      <div class="rules">Blackjack pays 3 to 2 · Dealer stands on all 17s · 6 decks</div>

      <div id="message" class="message" role="status" aria-live="polite">Place your bet to begin</div>

      <section class="area player-area" aria-label="Player">
        <div id="player-hands" class="hands"></div>
      </section>
    </main>

    <footer class="controls">
      <div id="betting-controls" class="control-row">
        <div class="bet-display">
          <span class="label">Bet</span>
          <span id="current-bet" class="value">$0</span>
        </div>
        <div class="chips">
          <button class="chip chip-5" data-chip="5" aria-label="Add $5">5</button>
          <button class="chip chip-25" data-chip="25" aria-label="Add $25">25</button>
          <button class="chip chip-100" data-chip="100" aria-label="Add $100">100</button>
          <button class="chip chip-500" data-chip="500" aria-label="Add $500">500</button>
        </div>
        <div class="buttons">
          <button id="btn-clear" class="btn btn-secondary">Clear</button>
          <button id="btn-rebet" class="btn btn-secondary" hidden>Rebet</button>
          <button id="btn-deal" class="btn btn-primary">Deal</button>
        </div>
      </div>

      <div id="action-controls" class="control-row" hidden>
        <div class="buttons">
          <button id="btn-hit" class="btn btn-primary" title="Shortcut: H">Hit</button>
          <button id="btn-stand" class="btn btn-primary" title="Shortcut: S">Stand</button>
          <button id="btn-double" class="btn btn-secondary" title="Shortcut: D">Double</button>
          <button id="btn-split" class="btn btn-secondary" title="Shortcut: P">Split</button>
        </div>
      </div>

      <div id="broke-controls" class="control-row" hidden>
        <p>You're out of chips.</p>
        <button id="btn-reset" class="btn btn-primary">Reset bankroll to $1,000</button>
      </div>

      <p class="credit">Cards by <a href="https://deckofcardsapi.com/" target="_blank" rel="noopener">Deck of Cards API</a></p>
    </footer>
    </div>
  </body>
</html>
